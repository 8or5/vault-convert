<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vault Convert</title>
<meta name="referrer" content="no-referrer" />
<!-- No network access is possible from this page: every fetch, XHR, WebSocket and worker is blocked. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'" />
<style>/* Vault Convert: visual system. Light and dark themes, two densities, system fonts only. */

:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --surface-2: #f1f5f9;
  --surface-3: #e7edf3;
  --text: #0f172a;
  --muted: #5b6b7f;
  --border: #dde4ec;
  --accent: #0f766e;
  --accent-strong: #115e59;
  --accent-ink: #ffffff;
  --accent-soft: #d5f3ee;
  --danger: #b91c1c;
  --danger-soft: #fde8e8;
  --warn: #92400e;
  --warn-soft: #fdf1d6;
  --info: #1e40af;
  --info-soft: #dfe9fb;
  --ok: #166534;
  --ok-soft: #dcf5e3;
  --radius: 10px;
  --radius-sm: 7px;
  --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 8px 24px rgba(15, 23, 42, .08);
  --row-h: 56px;
  --sidebar-w: 248px;
  --detail-w: 430px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: light;
}

[data-theme="dark"] {
  --bg: #0b1119;
  --surface: #121a25;
  --surface-2: #0f1722;
  --surface-3: #1b2636;
  --text: #e6edf5;
  --muted: #94a3b8;
  --border: #223043;
  --accent: #2dd4bf;
  --accent-strong: #5eead4;
  --accent-ink: #052e2b;
  --accent-soft: #113a37;
  --danger: #f87171;
  --danger-soft: #3a1717;
  --warn: #fbbf24;
  --warn-soft: #3a2c10;
  --info: #93c5fd;
  --info-soft: #172a4a;
  --ok: #86efac;
  --ok-soft: #123222;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

@media (prefers-color-scheme: dark) {
  [data-theme="system"] {
    --bg: #0b1119; --surface: #121a25; --surface-2: #0f1722; --surface-3: #1b2636;
    --text: #e6edf5; --muted: #94a3b8; --border: #223043;
    --accent: #2dd4bf; --accent-strong: #5eead4; --accent-ink: #052e2b; --accent-soft: #113a37;
    --danger: #f87171; --danger-soft: #3a1717; --warn: #fbbf24; --warn-soft: #3a2c10;
    --info: #93c5fd; --info-soft: #172a4a; --ok: #86efac; --ok-soft: #123222;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}

[data-density="compact"] { --row-h: 40px; }

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 14px/1.45 var(--font);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
body.dragging::after {
  content: "Drop to import";
  position: fixed; inset: 12px; border: 2px dashed var(--accent); border-radius: 16px;
  display: grid; place-items: center; font-size: 22px; font-weight: 600; color: var(--accent);
  background: color-mix(in srgb, var(--bg) 85%, transparent); pointer-events: none; z-index: 50;
}
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
h1 { font-size: clamp(24px, 3.2vw, 34px); letter-spacing: -.02em; }
h2 { font-size: 18px; margin-bottom: 10px; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 28px 0 10px; }
h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 14px 10px 6px; }
p { margin: 0 0 10px; }
small { color: var(--muted); font-size: 12px; }
code { font-family: var(--mono); font-size: 12px; background: var(--surface-3); padding: 1px 5px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.lede { color: var(--muted); font-size: 15px; max-width: 62ch; }
.fine { color: var(--muted); font-size: 12.5px; }
.eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: 11.5px; color: var(--accent); font-weight: 600; margin-bottom: 10px; }

/* ---------- top bar ---------- */
.app { min-height: 100%; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; gap: 14px;
  height: 60px; padding: 0 16px;
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 210px; }
.brand strong { display: block; font-size: 15px; letter-spacing: -.01em; }
.brand small { font-size: 11.5px; }
.logo {
  width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px;
  background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: var(--accent-ink);
  font-size: 18px; font-weight: 700;
}
.search { flex: 1; max-width: 640px; }
.search input {
  width: 100%; height: 38px; padding: 0 14px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
}
.search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; background: var(--surface); }
.top-actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }

/* ---------- buttons & inputs ---------- */
.btn {
  appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--text);
  height: 34px; padding: 0 12px; border-radius: var(--radius-sm); font: inherit; font-weight: 500;
  cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
  transition: background .12s, border-color .12s, transform .05s;
}
.btn:hover:not(:disabled) { background: var(--surface-2); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { background: var(--accent-strong); }
.btn.danger { color: var(--danger); }
.btn.danger:hover:not(:disabled) { background: var(--danger-soft); border-color: var(--danger); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); }
.btn.icon { width: 34px; padding: 0; justify-content: center; font-size: 15px; }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12.5px; }
.btn.on { background: var(--accent-soft); color: var(--accent-strong); border-color: transparent; }
.mobile-only { display: none; }

input, select, textarea {
  font: inherit; color: var(--text); background: var(--surface); width: 100%;
  border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; min-height: 34px;
}
textarea { resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
input[type="checkbox"], input[type="radio"] { width: auto; min-height: 0; accent-color: var(--accent); }
label { display: block; font-size: 12.5px; color: var(--muted); font-weight: 500; }
label input, label select, label textarea { margin-top: 5px; color: var(--text); }
label.check { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 13.5px; }
label.check input { margin: 0; }
fieldset { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; margin: 0; }
legend { font-size: 12px; color: var(--muted); padding: 0 6px; }

/* ---------- layout ---------- */
.layout { flex: 1; display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 0; }
.layout.has-detail { grid-template-columns: var(--sidebar-w) minmax(0, 1fr) var(--detail-w); }
.layout > .sidebar[hidden] { display: none; }
.layout > .sidebar + .main { grid-column: auto; }
.main { min-width: 0; padding: 20px 22px 40px; }
.layout:not(.has-detail) .main { grid-column: 2 / span 2; }
.sidebar {
  border-right: 1px solid var(--border); background: var(--surface-2);
  padding: 8px 10px 24px; overflow-y: auto; position: sticky; top: 60px; height: calc(100vh - 60px);
}
.sidebar section + section { border-top: 1px solid var(--border); margin-top: 8px; padding-top: 4px; }
.nav {
  appearance: none; border: 0; background: transparent; color: var(--text); font: inherit;
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 10px; border-radius: 8px; cursor: pointer; text-align: left; min-width: 0;
}
.nav:hover { background: var(--surface-3); }
.nav.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
.nav.depth-1 { padding-left: 26px; font-size: 13px; color: var(--muted); }
.nav.depth-1.active { color: var(--accent-strong); }
.nav-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav-row { position: relative; }
.nav-row .nav { padding-right: 70px; }
.mini { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); display: none; gap: 2px; }
.nav-row:hover .mini, .nav-row:focus-within .mini { display: flex; }
.mini button {
  width: 22px; height: 22px; border: 0; border-radius: 6px; background: var(--surface); color: var(--muted);
  cursor: pointer; font-size: 12px;
}
.mini button:hover { color: var(--text); background: var(--surface-3); }
.sidebar-add { padding: 8px 4px; }

.main .welcome[hidden], .workspace[hidden] { display: none; }
.welcome { max-width: 820px; margin: 24px auto 0; }
.hero { padding: 18px 0; }
.dropzone {
  margin: 24px 0 18px; border: 2px dashed color-mix(in srgb, var(--accent) 50%, var(--border));
  border-radius: 16px; padding: 38px 20px; text-align: center; cursor: pointer; background: var(--surface);
  display: grid; gap: 6px; justify-items: center; transition: border-color .15s, background .15s;
}
.dropzone:hover, .dropzone:focus-visible { border-color: var(--accent); background: var(--accent-soft); outline: none; }
.dropzone strong { font-size: 16px; }
.dropzone span { color: var(--muted); font-size: 13px; }
.dz-icon { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); font-size: 20px; }
.hero-actions { display: flex; gap: 10px; }
.format-chips { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.format-chips li { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font-size: 13px; }

/* ---------- workspace ---------- */
.banner {
  display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap;
  padding: 12px 14px; border-radius: var(--radius); margin-bottom: 14px; font-size: 13.5px;
  border: 1px solid var(--border);
}
.banner.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.banner.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.banner-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; min-height: 36px; }
.counts { color: var(--muted); font-size: 13px; }
.counts strong { color: var(--text); }
.sel { color: var(--accent-strong); font-weight: 600; }
.bulk { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; background: var(--surface); border: 1px solid var(--border); padding: 6px; border-radius: var(--radius); box-shadow: var(--shadow); }
.bulk[hidden] { display: none; }
.sort { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; }
.sort select { width: auto; min-height: 30px; padding: 4px 8px; }

.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: auto; box-shadow: var(--shadow); }
table.items { width: 100%; border-collapse: collapse; min-width: 640px; }
table.items th {
  position: sticky; top: 0; z-index: 1; text-align: left; background: var(--surface-2);
  font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600;
  padding: 10px 12px; border-bottom: 1px solid var(--border);
}
table.items td { padding: 0 12px; height: var(--row-h); border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 13.5px; }
table.items tbody tr { cursor: pointer; transition: background .08s; }
table.items tbody tr:hover { background: var(--surface-2); }
table.items tbody tr.open { background: var(--accent-soft); }
table.items tbody tr.selected { background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
table.items tr:last-child td { border-bottom: 0; }
.c-check { width: 36px; text-align: center; }
.c-fav { width: 36px; text-align: center; }
.c-name { min-width: 220px; }
.c-user, .c-url, .c-folder { color: var(--muted); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-date { color: var(--muted); white-space: nowrap; font-size: 12.5px; }
.c-flags { white-space: nowrap; }
.empty { text-align: center; color: var(--muted); padding: 32px !important; }
.star { border: 0; background: transparent; cursor: pointer; color: var(--muted); font-size: 16px; padding: 4px; border-radius: 6px; }
.star:hover { color: var(--warn); }
.star.on { color: #d97706; }
.name { display: flex; align-items: center; gap: 10px; min-width: 0; }
.name > div { min-width: 0; }
.name strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.name small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.glyph {
  width: 28px; height: 28px; flex: 0 0 28px; display: grid; place-items: center; border-radius: 8px;
  background: var(--surface-3); color: var(--accent-strong); font-size: 14px;
}
.glyph.big { width: 36px; height: 36px; flex-basis: 36px; font-size: 17px; }

.chip {
  display: inline-block; font-size: 11.5px; padding: 2px 8px; border-radius: 999px; margin-right: 4px;
  background: var(--surface-3); color: var(--muted); font-weight: 500; white-space: nowrap;
}
.chip.error { background: var(--danger-soft); color: var(--danger); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.info { background: var(--info-soft); color: var(--info); }

/* ---------- detail panel ---------- */
.detail {
  border-left: 1px solid var(--border); background: var(--surface);
  position: sticky; top: 60px; height: calc(100vh - 60px); overflow-y: auto;
  display: flex; flex-direction: column;
}
.detail[hidden] { display: none; }
.detail-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 20px 12px; border-bottom: 1px solid var(--border); }
.detail-title { display: flex; gap: 12px; align-items: center; min-width: 0; }
.detail-title strong { display: block; font-size: 16px; overflow: hidden; text-overflow: ellipsis; }
.fields { padding: 16px 20px; display: grid; gap: 14px; flex: 1; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: end; }
.with-btn { display: flex; gap: 6px; align-items: center; margin-top: 5px; }
.with-btn input { margin-top: 0; flex: 1; min-width: 0; }
.with-btn .btn { flex: 0 0 auto; }
.fav-check { padding-bottom: 6px; }
.strength { height: 4px; border-radius: 4px; background: var(--surface-3); margin-top: 6px; overflow: hidden; }
.strength span { display: block; height: 100%; width: 0; transition: width .2s, background .2s; }
.strength.s1 span { width: 25%; background: var(--danger); }
.strength.s2 span { width: 50%; background: var(--warn); }
.strength.s3 span { width: 75%; background: #65a30d; }
.strength.s4 span { width: 100%; background: var(--ok); }

.flag-list { padding: 12px 20px 0; display: grid; gap: 8px; }
.flag { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); font-size: 13px; }
.flag > div { display: grid; gap: 2px; }
.flag span { color: var(--muted); font-size: 12.5px; }
.flag.error { background: var(--danger-soft); }
.flag.warn { background: var(--warn-soft); }
.flag.info { background: var(--info-soft); }
.flag.error strong { color: var(--danger); }
.flag.warn strong { color: var(--warn); }
.flag.info strong { color: var(--info); }

.totp { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 12px; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--border); }
.totp.invalid { color: var(--danger); font-size: 13px; grid-template-columns: 1fr; }
.totp-code { font: 600 22px/1 var(--mono); letter-spacing: .08em; font-variant-numeric: tabular-nums; }
.totp-bar { grid-column: 1 / -1; height: 3px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
.totp-bar span { display: block; height: 100%; background: var(--accent); transition: width .9s linear; }
.totp small { margin-left: 8px; }
.suggest { background: var(--surface-2); border: 1px dashed color-mix(in srgb, var(--accent) 45%, var(--border)); border-radius: var(--radius-sm); padding: 12px; display: grid; gap: 8px; font-size: 13px; }
.suggest-list { display: flex; flex-wrap: wrap; gap: 6px; }
.suggest-list.stacked { flex-direction: column; align-items: stretch; margin-bottom: 16px; }
.suggest-list.stacked .btn { justify-content: space-between; height: auto; padding: 9px 12px; }
.cf { display: grid; gap: 8px; }
.cf-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.cf-row { display: grid; grid-template-columns: 1fr 1.4fr auto auto; gap: 6px; }
.cf-row input { margin-top: 0; }
.meta { color: var(--muted); font-size: 12px; margin: 0; }
.detail-foot { display: flex; justify-content: space-between; padding: 14px 20px; border-top: 1px solid var(--border); background: var(--surface-2); position: sticky; bottom: 0; }

/* ---------- toasts & modal ---------- */
.toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: grid; gap: 8px; z-index: 60; width: min(92vw, 480px); }
.toast { background: var(--text); color: var(--bg); padding: 11px 14px; border-radius: var(--radius-sm); box-shadow: var(--shadow); font-size: 13.5px; animation: rise .2s ease-out; }
.toast.error { background: var(--danger); color: #fff; }
@keyframes rise { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

.modal {
  border: 1px solid var(--border); border-radius: 14px; padding: 0; background: var(--surface); color: var(--text);
  width: min(92vw, 480px); box-shadow: 0 24px 64px rgba(0, 0, 0, .3);
}
.modal.wide { width: min(94vw, 880px); }
.modal::backdrop { background: rgba(8, 15, 25, .5); backdrop-filter: blur(2px); }
.modal-inner { padding: 22px; }
.stack { display: grid; gap: 14px; }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; flex-wrap: wrap; }
.warn-list { margin: 10px 0; padding-left: 18px; color: var(--warn); font-size: 13px; }
.warning { color: var(--danger); font-size: 12.5px; background: var(--danger-soft); padding: 10px 12px; border-radius: var(--radius-sm); }
.preview { font-size: 13px; padding-left: 18px; }
.type-counts { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.export-grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 18px; }
.formats { display: grid; gap: 6px; align-content: start; }
.fmt { display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; color: var(--text); }
.fmt:hover { background: var(--surface-2); }
.fmt:has(input:checked) { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.fmt input { margin-top: 4px; }
.fmt > div { display: grid; gap: 2px; }
.fmt strong { font-size: 13.5px; }
.fmt small { font-size: 12px; }
.export-side { display: grid; gap: 14px; align-content: start; }
.export-side fieldset { display: grid; gap: 8px; }
.summary { font-size: 13.5px; background: var(--surface-2); padding: 12px; border-radius: var(--radius-sm); }
.summary p { margin-bottom: 6px; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .layout.has-detail { grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
  .detail { position: fixed; top: 60px; right: 0; bottom: 0; width: min(var(--detail-w), 100vw); height: auto; z-index: 20; box-shadow: var(--shadow); }
  .layout:not(.has-detail) .main { grid-column: auto; }
}
@media (max-width: 860px) {
  .mobile-only { display: inline-flex; }
  .brand small, .top-actions .btn:not(.primary):not(.icon) { display: none; }
  .brand { min-width: 0; }
  .layout { grid-template-columns: 1fr; }
  .sidebar { position: fixed; top: 60px; left: 0; bottom: 0; width: 270px; height: auto; z-index: 25; transform: translateX(-102%); transition: transform .2s; }
  body.sidebar-open .sidebar { transform: none; box-shadow: var(--shadow); }
  .main { padding: 14px; }
  .export-grid { grid-template-columns: 1fr; }
}

/* ---------- KeePass mode, click-to-copy, autofill ---------- */
.toast.warn { background: var(--warn); color: #fff; }
.dbbar { display: flex; align-items: center; gap: 8px; margin-left: 4px; }
.dbbar[hidden] { display: none; }
.dbchip { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer; font: inherit; font-size: 13px; max-width: 220px; }
.dbchip:hover { border-color: var(--accent); }
.dbchip .dbname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dbchip .dirty { color: var(--warn); font-size: 11px; }
.i { flex: none; vertical-align: -3px; }

.lock { display: grid; place-items: center; min-height: 60vh; }
.lock[hidden] { display: none; }
.lock-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 32px; width: min(92vw, 380px); text-align: center; display: grid; gap: 10px; }
.lock-icon { width: 56px; height: 56px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; margin: 0 auto; }
.modal-actions.center { justify-content: center; }

.hero { padding: 8px 0 32px; }
.hero h1 { font-size: 28px; line-height: 1.2; margin: 4px 0 10px; }
.eyebrow { color: var(--accent-strong); font-weight: 600; font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase; margin: 0; }
.lede { color: var(--muted); margin: 0 0 14px; }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 22px 0 16px; }
.card { text-align: left; display: grid; gap: 6px; align-content: start; padding: 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); color: var(--text); cursor: pointer; font: inherit; }
.card span:last-child { color: var(--muted); font-size: 13px; }
.card:hover { border-color: var(--accent); box-shadow: var(--shadow); }
.card.primary { border-color: var(--accent); }
.card-ico { width: 38px; height: 38px; border-radius: 10px; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; }

.quick { display: flex; gap: 2px; opacity: 0; transition: opacity .12s; justify-content: flex-end; }
tr:hover .quick, tr.open .quick, tr:focus-within .quick { opacity: 1; }
@media (hover: none) { .quick { opacity: 1; } }
.c-quick { width: 1%; white-space: nowrap; }
.qbtn { display: inline-flex; align-items: center; gap: 4px; border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 6px; font: inherit; font-size: 12px; }
.qbtn:hover { background: var(--accent-soft); color: var(--accent-strong); }
.qbtn.lbl { border: 1px solid var(--border); padding: 4px 8px; color: var(--text); }
.qbtn.copied, .vrow.copied { background: var(--ok-soft); }

.detail-actions { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 20px; border-bottom: 1px solid var(--border); align-items: center; }
.detail-foot { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); justify-content: space-between; }
.view { padding: 8px 12px 20px; display: grid; gap: 2px; }
.vrow { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: var(--radius-sm); cursor: pointer; transition: background .15s; }
.vrow:hover, .vrow:focus-visible { background: var(--surface-2); outline: none; }
.vrow:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.vrow.multi { align-items: start; }
.vrow.multi .vvalue { white-space: pre-wrap; }
.vrow.bad { cursor: default; color: var(--danger); }
.vlabel { color: var(--muted); font-size: 12.5px; }
.vvalue { overflow-wrap: anywhere; min-width: 0; }
.vvalue.mono { font-family: var(--mono); }
.vactions { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
.vrow .copy-ico { opacity: 0; transition: opacity .12s; }
.vrow:hover .copy-ico, .vrow:focus-visible .copy-ico { opacity: 1; }
.ibtn { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 6px; display: inline-grid; place-items: center; }
.ibtn:hover { background: var(--surface-3); color: var(--text); }
.view .totp-code { font-family: var(--mono); font-size: 20px; letter-spacing: .08em; }
.view .vvalue small { margin-left: 8px; color: var(--muted); }
.view .totp-bar { display: block; height: 3px; background: var(--surface-3); border-radius: 3px; margin-top: 6px; overflow: hidden; }
.view-meta { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
.hist { margin: 8px 10px; }
.pad { padding: 10px; }
.att-row { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 4px 0; }

.form-error { color: var(--danger); background: var(--danger-soft); padding: 8px 10px; border-radius: var(--radius-sm); margin: 0; font-size: 13px; }
.form-error[hidden] { display: none; }
.banner.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.steps { padding-left: 20px; display: grid; gap: 12px; }
.bm-link { display: inline-flex; gap: 6px; align-items: center; padding: 8px 14px; border-radius: 999px; background: var(--accent); color: var(--accent-ink); text-decoration: none; font-weight: 600; cursor: grab; }
.ico-inline { color: var(--accent-strong); }
#enc-box { display: grid; gap: 10px; }
#enc-box[hidden], #enc-box [hidden], #exp-warning[hidden] { display: none; }

/* floating fill assistant (rendered in its own window) */
.assist { font-family: var(--font); color: var(--text); background: var(--bg); min-height: 100vh; padding: 12px; display: grid; gap: 10px; align-content: start; }
.assist-head { display: grid; }
.assist-head small, .ainfo small { color: var(--muted); }
.assist input[type=search] { width: 100%; height: 34px; padding: 0 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; }
.assist-status { min-height: 18px; font-size: 12.5px; color: var(--ok); }
.arow { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 10px; display: grid; gap: 6px; margin-bottom: 8px; }
.ainfo { display: grid; }
.abtns { display: flex; gap: 6px; flex-wrap: wrap; }

@media (max-width: 760px) {
  .cards { grid-template-columns: 1fr; }
  .dbchip { max-width: 140px; }
}
</style>
</head>
<body>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">⬡</span>
      <div><strong>Vault Convert</strong><small>Offline · nothing leaves this page</small></div>
    </div>
    <button class="btn ghost icon mobile-only" data-action="toggle-sidebar" aria-label="Toggle sidebar">☰</button>
    <div id="dbbar" class="dbbar" hidden></div>
    <label class="search">
      <span class="sr-only">Search</span>
      <input id="search" type="search" placeholder="Search names, usernames, sites, notes  ( / )" autocomplete="off" />
    </label>
    <div class="top-actions">
      <button class="btn" data-action="import">Import</button>
      <button class="btn" data-action="autofill" title="Fill logins without an extension">Autofill</button>
      <button class="btn" data-action="new-item" title="New item (N)">+ New</button>
      <button class="btn ghost" id="btn-undo" data-action="undo" title="Undo (Ctrl+Z)">Undo</button>
      <button class="btn primary" data-action="export" title="Export (Ctrl+E)">Export</button>
      <button class="btn ghost icon" data-action="prefs" aria-label="Preferences" title="Preferences">⚙</button>
    </div>
  </header>

  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar" hidden></aside>
    <main class="main" id="main">
      <section id="welcome" class="welcome"></section>
      <section id="lock" class="lock" hidden></section>
      <section id="workspace" class="workspace" hidden>
        <div id="banner"></div>
        <div class="toolbar">
          <div id="counts" class="counts"></div>
          <div id="bulk" class="bulk" hidden></div>
          <label class="sort">Sort
            <select id="sort">
              <option value="name">Name</option>
              <option value="updated">Recently updated</option>
              <option value="vault">Vault / folder</option>
              <option value="username">Username</option>
            </select>
          </label>
        </div>
        <div class="table-wrap">
          <table class="items">
            <thead id="thead"></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>
    <aside class="detail" id="detail" hidden></aside>
  </div>

  <dialog id="modal" class="modal"></dialog>
  <input type="file" id="file-input" multiple hidden accept=".csv,.json,.xml,.1pux,.1pif,.zip,.txt,.kdbx" />
  <input type="file" id="kdbx-input" hidden accept=".kdbx" />
  <input type="file" id="att-input" multiple hidden />
  <div id="toasts" class="toasts" aria-live="polite"></div>
</div>
